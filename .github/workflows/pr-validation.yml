# PR validation workflow - test builds and content quality
name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches:
      - main
    paths:
      - 'content/**'
      - 'config.yaml'
      - 'go.mod'
      - 'go.sum'
      - '.hugo-version'
      - 'layouts/**'
      - 'assets/**'
      - 'static/**'
      - '_vendor/**'
      - 'scripts/**'
      - '.gitignore'
      - '.github/workflows/**'

# Only newer runs of this workflow for the same PR supersede older work.
# Non-PR runs have unique keys, preserving every main/manual/scheduled run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-build:
    runs-on: ubuntu-latest
    env:
      HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Read pinned Hugo version
        id: versions
        run: |
          HUGO_VERSION=$(cat .hugo-version)
          echo "hugo_version=${HUGO_VERSION}" >> $GITHUB_OUTPUT
          echo "Using Hugo version: ${HUGO_VERSION}"
      
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: ${{ steps.versions.outputs.hugo_version }}
          extended: true

      - name: Verify vendored theme
        run: |
          test -f _vendor/modules.txt

      - name: Validate Hugo Configuration
        run: |
          echo "Validating Hugo configuration..."
          ./scripts/hugo.sh config
          echo "✅ Configuration is valid"

      - name: Check for Draft Posts
        run: |
          echo "Checking for draft posts..."
          DRAFTS=$(hugo list drafts | wc -l)
          if [ $DRAFTS -gt 1 ]; then
            echo "⚠️  Found $((DRAFTS-1)) draft posts"
            hugo list drafts
          else
            echo "✅ No draft posts found"
          fi

      - name: Check for Future Posts
        run: |
          echo "Checking for future posts..."
          FUTURE=$(hugo list future | wc -l)
          if [ $FUTURE -gt 1 ]; then
            echo "⚠️  Found $((FUTURE-1)) future posts"
            hugo list future
            echo "Note: Future posts are built with --buildFuture flag in production"
          else
            echo "✅ No future posts found"
          fi

      # Keep cheap checks on drafts, but never report full CI as successful.
      # ready_for_review reruns this job at the same SHA; synchronize tests
      # every later ready update. Conversion to draft cancels obsolete PR work.
      - name: Require review readiness for full verification
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo '::error::Full verification is deferred while this PR is a draft. Mark it ready for review to run all checks.'
          exit 1

      - name: Test Build (Development)
        run: |
          echo "Testing development build..."
          ./scripts/hugo.sh --buildDrafts --buildFuture --destination "${RUNNER_TEMP}/hugo-development"
          echo "✅ Development build successful"

      - name: Test Build (Production)
        run: |
          echo "Testing production build..."
          ./scripts/hugo.sh --minify --buildFuture --cleanDestinationDir
          echo "✅ Production build successful"

      - name: Test Internal Link Checker
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Check Rendered Internal Links
        run: python3 scripts/check_internal_links.py public --base-url https://cloudartisan.com/

      - name: Check Build Output
        run: |
          echo "Analysing build output..."
          echo "Total pages: $(find public -name "*.html" | wc -l)"
          echo "Total assets: $(find public -type f ! -name "*.html" | wc -l)"
          echo "Site size: $(du -sh public | cut -f1)"
          
          # Check for common issues
          if [ ! -f "public/index.html" ]; then
            echo "❌ Missing homepage!"
            exit 1
          fi
          
          if [ ! -f "public/posts/index.html" ]; then
            echo "❌ Missing posts index!"
            exit 1
          fi
          
          echo "✅ Build output looks good"

  validate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check Markdown Files
        run: |
          echo "Validating markdown files..."
          
          # Check for files with missing front matter
          for file in content/posts/*.md; do
            if [ -f "$file" ]; then
              if ! head -1 "$file" | grep -q "^---"; then
                echo "❌ Missing front matter in $file"
                exit 1
              fi
            fi
          done
          
          # Check for required front matter fields
          for file in content/posts/*.md; do
            if [ -f "$file" ]; then
              if ! grep -q "^title:" "$file"; then
                echo "❌ Missing title in $file"
                exit 1
              fi
              if ! grep -q "^date:" "$file"; then
                echo "❌ Missing date in $file"
                exit 1
              fi
            fi
          done
          
          echo "✅ All markdown files have valid front matter"

  validate-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check Image References
        run: |
          echo "Checking image references in content..."
          
          # Find all image references in markdown
          for file in content/**/*.md; do
            if [ -f "$file" ]; then
              # Check for markdown image syntax
              grep -n "!\[.*\](" "$file" | while read -r line; do
                image_path=$(echo "$line" | sed 's/.*!\[.*\](\([^)]*\)).*/\1/')
                
                # Skip external URLs
                if [[ "$image_path" =~ ^https?:// ]]; then
                  continue
                fi
                
                # Check if local image exists
                if [[ "$image_path" =~ ^/ ]]; then
                  # Absolute path
                  full_path="static${image_path}"
                else
                  # Relative path
                  dir=$(dirname "$file")
                  full_path="${dir}/${image_path}"
                fi
                
                if [ ! -f "$full_path" ]; then
                  echo "❌ Missing image: $image_path referenced in $file"
                  echo "   Expected at: $full_path"
                fi
              done
            fi
          done
          
          echo "✅ Image reference check complete"

  summary:
    runs-on: ubuntu-latest
    needs: [validate-build, validate-content, validate-images]
    if: always()
    steps:
      - name: PR Validation Summary
        run: |
          echo "## PR Validation Results 📝" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.validate-build.result }}" == "success" ]; then
            echo "✅ **Build Validation**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build Validation**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.validate-content.result }}" == "success" ]; then
            echo "✅ **Content Validation**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Content Validation**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.validate-images.result }}" == "success" ]; then
            echo "✅ **Image Validation**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Image Validation**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.validate-build.result }}" != "success" ] ||
             [ "${{ needs.validate-content.result }}" != "success" ] ||
             [ "${{ needs.validate-images.result }}" != "success" ] ||
             [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "Full PR validation has not passed." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "All PR validation checks passed." >> $GITHUB_STEP_SUMMARY
